<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Sheet Editor — APK.audio</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .workspace {
      display: grid;
      grid-template-columns: 1fr 320px;
      flex: 1;
      overflow: hidden;
    }
    .panel-right {
      background: var(--osc-bg-surface);
      border-left: 1px solid var(--osc-border-default);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--osc-text-muted);
      border-bottom: 1px solid var(--osc-border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-body {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }
    .canvas-viewport {
      background: var(--osc-bg-base);
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .toolbar-bar {
      height: 36px;
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }
  </style>
</head>
<body>
  <header class="app-window-header">
    <div class="window-title-group">
      <div class="window-dot" style="background: #3B82F6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);"></div>
      <span class="window-title">Drawing Sheet Editor</span>
      <span class="window-pill" id="block-tag" style="color: #3B82F6;">CAD / SHEET BORDER</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary btn-sm" id="btn-open-block">📂 Open Block</button>
      <button class="btn btn-secondary btn-sm" id="btn-discovered">⚡ Discovered</button>
      <button class="btn btn-secondary btn-sm" id="btn-open-model" title="Open an .ifc (or the sheet .json)">🧊 Open Model</button>
      <button class="btn btn-secondary btn-sm" id="btn-save-model" title="Save the sheet as IFC4X3 with its .json twin">🧊 Save Model</button>
      <button class="btn btn-primary btn-sm" id="btn-save-block">💾 Save & Return</button>
      <button class="btn btn-icon btn-sm" id="btn-close" title="Close Window">✕</button>
    </div>
  </header>

  <!-- What the bus knows (APKSoftapp.discovered): identity is MAC / serial, state good / kinda / dead. -->
  <section id="discovered-panel" hidden style="max-height: 40vh; overflow: auto; padding: 8px 14px; border-bottom: 1px solid var(--osc-border-default); background: var(--osc-bg-surface);">
    <div id="discovered-status" role="status" style="font-size: 11px; color: var(--osc-text-muted); margin-bottom: 6px;"></div>
    <div id="discovered-table"></div>
  </section>

  <div class="toolbar-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 11px; color: var(--osc-text-muted);">STANDARD SHEET SIZE:</span>
      <select class="input" id="sel-sheet-size" style="width: 240px; padding: 3px 7px; height: 26px;"></select>
    </div>
    <div style="font-size: 11px; color: var(--osc-text-muted);">
      ANSI / ISO Sheet Borders, Zone Markings, and Title Block
    </div>
  </div>

  <div class="workspace">
    <!-- Center Drawing Sheet Canvas -->
    <main class="canvas-viewport" id="canvas-wrapper">
      <!-- Sheet SVG dynamically rendered here -->
    </main>

    <!-- Right Inspector -->
    <aside class="panel-right">
      <div class="panel-header">
        <span>TITLE BLOCK METADATA</span>
      </div>
      <div class="panel-body" id="inspector-content">
        <!-- Title block properties rendered dynamically -->
      </div>
    </aside>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
